# Render Blueprint for the ParakhMitra FastAPI backend.
# Deploy via Render Dashboard -> New -> Blueprint, pointed at this repo.
# Secrets (sync:false) must be filled in the Render dashboard, not committed.
services:
  - type: web
    name: parakhmitra-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      # Comma-separated allowed frontend origins, e.g. https://parakhmitra.vercel.app
      - key: CORS_ORIGINS
        sync: false
      # Public frontend origin, used for the verification link printed on notices
      - key: APP_BASE_URL
        sync: false
